name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_FAVORIT_API_URL: ${{ vars.VITE_FAVORIT_API_URL || secrets.VITE_FAVORIT_API_URL }}
          VITE_FAVORIT_KEY: ${{ vars.VITE_FAVORIT_KEY || secrets.VITE_FAVORIT_KEY }}
        run: |
          for name in VITE_FAVORIT_API_URL VITE_FAVORIT_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name не задана: добавьте её в Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          [ -z "$missing" ] || exit 1
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
